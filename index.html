<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>一朵玫瑰</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #0a0008;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: radial-gradient(ellipse at 50% 30%, #3d0018 0%, #1a000a 45%, #0a0008 100%);
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Serif SC", "Source Han Serif SC", STSong, serif;
  }

  /* Stars */
  .stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  .star {
    position: absolute;
    width: 2px; height: 2px;
    border-radius: 50%;
    background: #fff;
    animation: twinkle var(--d, 3s) ease-in-out infinite var(--delay, 0s);
    opacity: 0;
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0; transform: scale(0.5); }
    50% { opacity: var(--bright, 0.7); transform: scale(1); }
  }

  /* Floating petals */
  .petals-bg {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    overflow: hidden;
  }
  .fp {
    position: absolute;
    top: -30px;
    width: 8px; height: 10px;
    border-radius: 50% 50% 50% 0;
    background: radial-gradient(circle at 40% 40%, #ff8ca0, #c0003a88);
    animation: fallPetal var(--fd, 8s) linear infinite var(--fdelay, 0s);
    opacity: 0;
    transform-origin: center;
  }
  @keyframes fallPetal {
    0%   { opacity: 0; top: -20px; transform: rotate(var(--frot,0deg)) translateX(0); }
    10%  { opacity: 0.6; }
    80%  { opacity: 0.4; }
    100% { opacity: 0; top: 105vh; transform: rotate(calc(var(--frot,0deg) + 360deg)) translateX(var(--fdx, 40px)); }
  }

  /* Particles / sparkles */
  .sparkles {
    position: absolute;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 2;
  }
  .spark {
    position: absolute;
    width: 3px; height: 3px;
    border-radius: 50%;
    background: #ffd6e0;
    animation: sparkle var(--sd, 2.5s) ease-in-out infinite var(--sdelay, 0s);
    opacity: 0;
  }
  @keyframes sparkle {
    0%, 100% { opacity: 0; transform: scale(0) translate(0,0); }
    30% { opacity: 1; }
    60% { opacity: 0.7; transform: scale(1.5) translate(var(--sdx,4px), var(--sdy,-8px)); }
    100% { opacity: 0; transform: scale(0) translate(var(--sdx2,8px), var(--sdy2,-20px)); }
  }

  /* Rose container */
  .rose-wrap {
    position: relative;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    animation: float 4.5s ease-in-out infinite, sway 7s ease-in-out infinite;
    filter: drop-shadow(0 0 22px #c0003a88) drop-shadow(0 0 60px #80001e44);
  }
  @keyframes float {
    0%, 100% { transform: translateY(0px) rotate(0deg); }
    50% { transform: translateY(-14px) rotate(0.5deg); }
  }
  @keyframes sway {
    0%, 100% { transform: rotate(-1.5deg); }
    50% { transform: rotate(1.5deg); }
  }

  /* SVG rose */
  .rose-svg {
    width: min(220px, 46vw);
    height: auto;
  }

  /* Glow ring behind bloom */
  .glow-ring {
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: min(180px, 38vw);
    height: min(180px, 38vw);
    border-radius: 50%;
    background: radial-gradient(circle, #ff003355 0%, #8b000022 50%, transparent 72%);
    animation: glowPulse 3s ease-in-out infinite;
    z-index: -1;
  }
  @keyframes glowPulse {
    0%, 100% { opacity: 0.6; transform: translateX(-50%) scale(1); }
    50% { opacity: 1; transform: translateX(-50%) scale(1.18); }
  }

  /* Text */
  .message {
    position: relative;
    z-index: 3;
    margin-top: clamp(10px, 3vw, 18px);
    padding: 0 clamp(22px, 7vw, 40px);
    text-align: center;
    color: #fde8ea;
    font-size: clamp(14px, 4.2vw, 18px);
    line-height: 1.95;
    letter-spacing: 0.06em;
    text-shadow: 0 0 18px #ff006688, 0 1px 3px #00000099;
    animation: fadeShimmer 6s ease-in-out infinite;
    max-width: 420px;
  }
  @keyframes fadeShimmer {
    0%   { opacity: 0.82; text-shadow: 0 0 12px #ff006655, 0 1px 3px #00000099; }
    50%  { opacity: 1;    text-shadow: 0 0 28px #ff88aa99, 0 1px 3px #00000099; }
    100% { opacity: 0.82; text-shadow: 0 0 12px #ff006655, 0 1px 3px #00000099; }
  }
  .message-enter {
    animation: fadeIn 2.5s ease forwards, fadeShimmer 6s 2.5s ease-in-out infinite;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Petal pulse on SVG */
  @keyframes petalPulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.85; }
  }
  .petals-outer { animation: petalPulse 3s ease-in-out infinite; }
  .petals-mid   { animation: petalPulse 3s ease-in-out infinite 0.4s; }
  .petals-inner { animation: petalPulse 3s ease-in-out infinite 0.8s; }

  /* Leaf sway */
  @keyframes leafSway {
    0%, 100% { transform-origin: bottom center; transform: rotate(-2deg); }
    50% { transform-origin: bottom center; transform: rotate(3deg); }
  }
  .leaf-left  { animation: leafSway 5s ease-in-out infinite; }
  .leaf-right { animation: leafSway 5s ease-in-out infinite 1.2s; }
</style>
</head>
<body>

<!-- Stars -->
<div class="stars" id="stars"></div>

<!-- Falling background petals -->
<div class="petals-bg" id="petalsBg"></div>

<div class="glow-ring"></div>

<!-- Rose SVG -->
<div class="rose-wrap">
  <div class="sparkles" id="sparks"></div>

  <svg class="rose-svg" viewBox="0 0 200 420" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="petalGrad" cx="50%" cy="60%" r="60%">
        <stop offset="0%" stop-color="#ff6b8a"/>
        <stop offset="40%" stop-color="#e0003d"/>
        <stop offset="100%" stop-color="#7a0020"/>
      </radialGradient>
      <radialGradient id="petalMid" cx="50%" cy="55%" r="60%">
        <stop offset="0%" stop-color="#ff8fa3"/>
        <stop offset="50%" stop-color="#cc0033"/>
        <stop offset="100%" stop-color="#5a0018"/>
      </radialGradient>
      <radialGradient id="petalInner" cx="50%" cy="50%" r="60%">
        <stop offset="0%" stop-color="#ffb3c1"/>
        <stop offset="60%" stop-color="#ff2255"/>
        <stop offset="100%" stop-color="#800020"/>
      </radialGradient>
      <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#1a5c1a"/>
        <stop offset="50%" stop-color="#2e8b2e"/>
        <stop offset="100%" stop-color="#1a5c1a"/>
      </linearGradient>
      <linearGradient id="leafGradL" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#3aab3a"/>
        <stop offset="100%" stop-color="#145014"/>
      </linearGradient>
      <linearGradient id="leafGradR" x1="100%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#3aab3a"/>
        <stop offset="100%" stop-color="#145014"/>
      </linearGradient>
      <radialGradient id="centerGrad" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#ffcccc"/>
        <stop offset="100%" stop-color="#cc0044"/>
      </radialGradient>
      <filter id="softBloom">
        <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>

    <!-- Stem -->
    <path d="M100 420 C96 380 92 340 94 310 C96 280 100 250 100 220" 
          stroke="url(#stemGrad)" stroke-width="6" fill="none" stroke-linecap="round"/>

    <!-- Thorns -->
    <path d="M96 360 C86 355 82 348 87 344" stroke="#2e7a1a" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M100 300 C112 295 117 288 111 284" stroke="#2e7a1a" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Leaf left -->
    <g class="leaf-left">
      <path d="M94 330 C74 315 60 305 62 290 C72 290 85 300 94 315 Z" fill="url(#leafGradL)" opacity="0.95"/>
      <path d="M94 330 C80 320 70 312 62 290" stroke="#1a5c1a" stroke-width="0.8" fill="none"/>
    </g>

    <!-- Leaf right -->
    <g class="leaf-right">
      <path d="M100 280 C120 264 140 258 142 244 C130 244 116 255 100 268 Z" fill="url(#leafGradR)" opacity="0.95"/>
      <path d="M100 280 C118 266 132 258 142 244" stroke="#1a5c1a" stroke-width="0.8" fill="none"/>
    </g>

    <!-- Sepal -->
    <path d="M80 225 C72 218 68 208 76 204 C84 200 92 210 100 218" fill="#2e7a1a" opacity="0.9"/>
    <path d="M120 225 C128 218 132 208 124 204 C116 200 108 210 100 218" fill="#2e7a1a" opacity="0.9"/>
    <path d="M88 222 C85 212 86 200 93 196 C97 200 99 210 100 218" fill="#3aab3a" opacity="0.8"/>
    <path d="M112 222 C115 212 114 200 107 196 C103 200 101 210 100 218" fill="#3aab3a" opacity="0.8"/>
    <path d="M100 218 C98 210 99 200 100 194 C101 200 102 210 100 218" fill="#4ec44e" opacity="0.7"/>

    <!-- OUTER PETALS -->
    <g class="petals-outer" filter="url(#softBloom)">
      <path d="M100 218 C78 205 60 185 62 162 C64 140 80 128 100 125" fill="url(#petalGrad)" opacity="0.88"/>
      <path d="M100 218 C122 205 140 185 138 162 C136 140 120 128 100 125" fill="url(#petalGrad)" opacity="0.88"/>
      <path d="M100 218 C92 195 82 168 88 145 C92 130 98 122 100 118" fill="url(#petalGrad)" opacity="0.82"/>
      <path d="M100 218 C108 195 118 168 112 145 C108 130 102 122 100 118" fill="url(#petalGrad)" opacity="0.82"/>
      <path d="M100 218 C80 210 58 200 52 178 C46 156 60 140 80 138" fill="url(#petalGrad)" opacity="0.78"/>
      <path d="M100 218 C120 210 142 200 148 178 C154 156 140 140 120 138" fill="url(#petalGrad)" opacity="0.78"/>
    </g>

    <!-- MIDDLE PETALS -->
    <g class="petals-mid">
      <path d="M100 210 C84 196 70 178 74 158 C78 140 92 132 100 130" fill="url(#petalMid)" opacity="0.9"/>
      <path d="M100 210 C116 196 130 178 126 158 C122 140 108 132 100 130" fill="url(#petalMid)" opacity="0.9"/>
      <path d="M100 210 C88 196 78 172 84 152 C88 138 96 128 100 126" fill="url(#petalMid)" opacity="0.85"/>
      <path d="M100 210 C112 196 122 172 116 152 C112 138 104 128 100 126" fill="url(#petalMid)" opacity="0.85"/>
    </g>

    <!-- INNER PETALS -->
    <g class="petals-inner">
      <path d="M100 204 C90 192 82 176 88 160 C92 148 98 140 100 138" fill="url(#petalInner)" opacity="0.95"/>
      <path d="M100 204 C110 192 118 176 112 160 C108 148 102 140 100 138" fill="url(#petalInner)" opacity="0.95"/>
      <path d="M100 204 C92 192 86 178 90 162 C94 150 99 142 100 140" fill="url(#petalInner)" opacity="0.9"/>
      <path d="M100 204 C108 192 114 178 110 162 C106 150 101 142 100 140" fill="url(#petalInner)" opacity="0.9"/>
    </g>

    <!-- Center -->
    <ellipse cx="100" cy="152" rx="14" ry="12" fill="url(#centerGrad)" opacity="0.98"/>
    <ellipse cx="100" cy="152" rx="8" ry="7" fill="#ffc0cb" opacity="0.7"/>
    <ellipse cx="100" cy="151" rx="4" ry="3.5" fill="#ffeeee" opacity="0.9"/>
  </svg>
</div>

<!-- Message -->
<p class="message message-enter">
  我的小兔子，<br>
  距离阻挡不了我送你一朵玫瑰。<br>
  这朵玫瑰不会占你行李箱里任何空间。
</p>

<script>
  // Generate stars
  const starsEl = document.getElementById('stars');
  for (let i = 0; i < 60; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${2+Math.random()*4}s;--delay:${Math.random()*5}s;--bright:${0.3+Math.random()*0.7};width:${1+Math.random()*2}px;height:${1+Math.random()*2}px`;
    starsEl.appendChild(s);
  }

  // Falling petals
  const pbg = document.getElementById('petalsBg');
  for (let i = 0; i < 12; i++) {
    const p = document.createElement('div');
    p.className = 'fp';
    p.style.cssText = `left:${Math.random()*100}%;--fd:${6+Math.random()*8}s;--fdelay:${Math.random()*10}s;--frot:${Math.random()*360}deg;--fdx:${-60+Math.random()*120}px`;
    pbg.appendChild(p);
  }

  // Sparkles around rose
  const sparksEl = document.getElementById('sparks');
  for (let i = 0; i < 18; i++) {
    const sp = document.createElement('div');
    sp.className = 'spark';
    const angle = Math.random() * Math.PI * 2;
    const r = 30 + Math.random() * 60;
    sp.style.cssText = `left:calc(50% + ${Math.cos(angle)*r}px);top:${10+Math.random()*60}%;--sd:${1.5+Math.random()*3}s;--sdelay:${Math.random()*4}s;--sdx:${-10+Math.random()*20}px;--sdy:${-10+Math.random()*5}px;--sdx2:${-15+Math.random()*30}px;--sdy2:${-20+Math.random()*-10}px`;
    sparksEl.appendChild(sp);
  }
</script>
</body>
</html>
